<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Coach - Test Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .test-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .response-box {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
            min-height: 100px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .response-box.success {
            border-color: #28a745;
            background: #f0fff4;
        }

        .response-box.error {
            border-color: #dc3545;
            background: #fff5f5;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
        }

        .chat-messages {
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: white;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
        }

        .message.user {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }

        .message.assistant {
            background: #f1f8e9;
            border-left: 4px solid #8bc34a;
        }

        .message-header {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }

        .message-content {
            color: #333;
            line-height: 1.6;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .info-box {
            padding: 12px;
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Learning Coach</h1>
            <p>API Testing Interface</p>
        </div>

        <div class="content">
            <!-- Health Check Section -->
            <div class="section">
                <h2>1. Health Check <span id="health-status" class="status hidden"></span></h2>
                <div class="test-buttons">
                    <button onclick="testHealth()">Test /api/health</button>
                    <button onclick="testRoot()">Test / (Root)</button>
                </div>
                <div id="health-response" class="response-box hidden"></div>
            </div>

            <!-- Onboarding Section -->
            <div class="section">
                <h2>2. Onboarding & Consent</h2>
                <div class="form-group">
                    <label>Session ID (optional):</label>
                    <input type="text" id="session-id" placeholder="Leave empty to auto-generate">
                </div>
                <div class="form-group">
                    <label>Learning Level:</label>
                    <select id="learning-level">
                        <option value="">Select...</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Interests:</label>
                    <input type="text" id="interests" placeholder="e.g., Python Programming, Machine Learning">
                </div>
                <div class="form-group">
                    <label>Goals:</label>
                    <input type="text" id="goals" placeholder="e.g., Build a web application">
                </div>
                <div class="form-group">
                    <label>Preferred Style:</label>
                    <select id="preferred-style">
                        <option value="">Select...</option>
                        <option value="hands-on">Hands-on</option>
                        <option value="theoretical">Theoretical</option>
                        <option value="mixed">Mixed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="consent" checked> 
                        Remember conversation (Consent)
                    </label>
                </div>
                <div class="test-buttons">
                    <button class="btn-success" onclick="testOnboarding()">Submit Onboarding</button>
                </div>
                <div id="onboarding-response" class="response-box hidden"></div>
            </div>

            <!-- Chat Section -->
            <div class="section">
                <h2>3. Chat Interface</h2>
                <div class="info-box">
                    <strong>Session ID:</strong> <span id="current-session-id">Not set</span>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div class="message assistant">
                        <div class="message-header">🤖 Assistant</div>
                        <div class="message-content">Hello! I'm your Learning Coach. Send me a message to start chatting!</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Your Message:</label>
                    <textarea id="chat-message" placeholder="Type your message here..."></textarea>
                </div>
                <div class="test-buttons">
                    <button onclick="sendChatMessage()" id="send-btn">Send Message</button>
                    <button class="btn-danger" onclick="clearChat()">Clear Chat</button>
                </div>
                <div id="chat-status" class="status hidden"></div>
            </div>

            <!-- Save Message Section -->
            <div class="section">
                <h2>4. Save Message (Testing)</h2>
                <div class="form-group">
                    <label>Role:</label>
                    <select id="save-role">
                        <option value="user">User</option>
                        <option value="assistant">Assistant</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Content:</label>
                    <textarea id="save-content" placeholder="Message content to save"></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="save-onboarding"> 
                        Is Onboarding Message
                    </label>
                </div>
                <div class="test-buttons">
                    <button onclick="testSaveMessage()">Save Message</button>
                </div>
                <div id="save-response" class="response-box hidden"></div>
            </div>
        </div>
    </div>

    <script>
        // API Base URL - empty for same domain
        const API_BASE = (window.location.origin || '').replace(/\/$/, '');

        // Session management
        let currentSessionId = localStorage.getItem('test_session_id') || '';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (currentSessionId) {
                document.getElementById('current-session-id').textContent = currentSessionId;
                document.getElementById('session-id').value = currentSessionId;
            }
        });

        // Helper function to show response
        function showResponse(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.classList.remove('hidden', 'success', 'error');
            element.classList.add(isError ? 'error' : 'success');
            element.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        }

        // Helper function to show status
        function showStatus(statusId, text, type = 'loading') {
            const status = document.getElementById(statusId);
            status.textContent = text;
            status.className = `status ${type}`;
            status.classList.remove('hidden');
        }

        // Test Health Endpoint
        async function testHealth() {
            showStatus('health-status', 'Testing...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                showResponse('health-response', data, !response.ok);
                showStatus('health-status', response.ok ? '✓ Success' : '✗ Error', response.ok ? 'success' : 'error');
            } catch (error) {
                showResponse('health-response', `Error: ${error.message}`, true);
                showStatus('health-status', '✗ Error', 'error');
            }
        }

        // Test Root Endpoint
        async function testRoot() {
            showStatus('health-status', 'Testing...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/`);
                const data = await response.json();
                showResponse('health-response', data, !response.ok);
                showStatus('health-status', response.ok ? '✓ Success' : '✗ Error', response.ok ? 'success' : 'error');
            } catch (error) {
                showResponse('health-response', `Error: ${error.message}`, true);
                showStatus('health-status', '✗ Error', 'error');
            }
        }

        // Test Onboarding
        async function testOnboarding() {
            const sessionId = document.getElementById('session-id').value || currentSessionId;
            const learningLevel = document.getElementById('learning-level').value;
            const interests = document.getElementById('interests').value;
            const goals = document.getElementById('goals').value;
            const preferredStyle = document.getElementById('preferred-style').value;
            const consent = document.getElementById('consent').checked;

            const onboardingData = {
                learningLevel,
                interests,
                goals,
                preferredStyle
            };

            try {
                const response = await fetch(`${API_BASE}/api/onboarding/consent`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        consent: consent,
                        session_id: sessionId || null,
                        onboarding_data: onboardingData
                    })
                });

                const data = await response.json();
                showResponse('onboarding-response', data, !response.ok);

                // Update session ID if returned
                if (data.session_id) {
                    currentSessionId = data.session_id;
                    localStorage.setItem('test_session_id', currentSessionId);
                    document.getElementById('current-session-id').textContent = currentSessionId;
                    document.getElementById('session-id').value = currentSessionId;
                }
            } catch (error) {
                showResponse('onboarding-response', `Error: ${error.message}`, true);
            }
        }

        // Send Chat Message
        async function sendChatMessage() {
            const message = document.getElementById('chat-message').value.trim();
            if (!message) {
                alert('Please enter a message');
                return;
            }

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading-spinner"></span> Sending...';

            // Add user message to chat
            addChatMessage('user', message);
            document.getElementById('chat-message').value = '';

            // Clear previous assistant message if streaming
            let assistantMessageDiv = null;

            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: currentSessionId || null
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Handle SSE stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let accumulatedResponse = '';

                // Create assistant message div
                assistantMessageDiv = addChatMessage('assistant', '');
                const contentDiv = assistantMessageDiv.querySelector('.message-content');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                // Streaming complete
                                break;
                            } else if (data) {
                                accumulatedResponse += data;
                                contentDiv.textContent = accumulatedResponse;
                            }
                        }
                    }
                }

                // Update session ID from headers if available
                const sessionIdHeader = response.headers.get('X-Session-ID');
                if (sessionIdHeader) {
                    currentSessionId = sessionIdHeader;
                    localStorage.setItem('test_session_id', currentSessionId);
                    document.getElementById('current-session-id').textContent = currentSessionId;
                }

            } catch (error) {
                if (assistantMessageDiv) {
                    assistantMessageDiv.querySelector('.message-content').textContent = `Error: ${error.message}`;
                } else {
                    addChatMessage('assistant', `Error: ${error.message}`);
                }
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Message';
            }
        }

        // Add message to chat
        function addChatMessage(role, content) {
            const messagesDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `
                <div class="message-header">${role === 'user' ? '👤 You' : '🤖 Assistant'}</div>
                <div class="message-content">${content}</div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return messageDiv;
        }

        // Clear chat
        function clearChat() {
            const messagesDiv = document.getElementById('chat-messages');
            messagesDiv.innerHTML = `
                <div class="message assistant">
                    <div class="message-header">🤖 Assistant</div>
                    <div class="message-content">Chat cleared. Send me a message to start chatting!</div>
                </div>
            `;
        }

        // Test Save Message
        async function testSaveMessage() {
            const role = document.getElementById('save-role').value;
            const content = document.getElementById('save-content').value.trim();
            const isOnboarding = document.getElementById('save-onboarding').checked;

            if (!content) {
                alert('Please enter message content');
                return;
            }

            if (!currentSessionId) {
                alert('Please set a session ID first (use onboarding or send a chat message)');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/chat/save`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        role: role,
                        content: content,
                        is_onboarding: isOnboarding
                    })
                });

                const data = await response.json();
                showResponse('save-response', data, !response.ok);
            } catch (error) {
                showResponse('save-response', `Error: ${error.message}`, true);
            }
        }

        // Allow Enter key to send message
        document.getElementById('chat-message').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });
    </script>
</body>
</html>
